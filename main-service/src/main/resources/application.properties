server.port=8080
spring.application.name=main-service

stats-server.url=${STATS_SERVER_URL:http://localhost:9090}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ewm_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ewm_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ewm_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

spring.sql.init.mode=always
# Level logging
logging.level.root=INFO
logging.level.ru.practicum=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

# Format logging
# logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# Wrighting logs to file
# logging.file.name=logs/application.log
# logging.file.max-size=10MB
# logging.file.max-history=7

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false